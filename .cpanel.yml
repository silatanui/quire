---
deployment:
  tasks:
    - export DEPLOYPATH=/home/ipusgkqs/public_html/quire/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/api
    - /bin/mkdir -p $DEPLOYPATH/config
    - /bin/cp index.html board.html deck.html icon.svg .htaccess $DEPLOYPATH
    - /bin/cp api/deck.php $DEPLOYPATH/api/
    - /bin/cp config/secrets.example.php $DEPLOYPATH/config/
    - if [ ! -f $DEPLOYPATH/config/secrets.php ]; then /bin/cp config/secrets.example.php $DEPLOYPATH/config/secrets.php; fi
    - /bin/cp -R images $DEPLOYPATH
    - /bin/cp -R css $DEPLOYPATH
    - /bin/cp -R js $DEPLOYPATH
    - /bin/rm -f /home/ipusgkqs/public_html/index.html
    - /bin/rm -f /home/ipusgkqs/public_html/css/app.css
    - /bin/rm -f /home/ipusgkqs/public_html/js/main.js /home/ipusgkqs/public_html/js/model.js /home/ipusgkqs/public_html/js/rough.js /home/ipusgkqs/public_html/js/rough.LICENSE
    - /bin/rmdir /home/ipusgkqs/public_html/css /home/ipusgkqs/public_html/js 2>/dev/null || /bin/true
